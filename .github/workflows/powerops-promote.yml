# M10 live check: a copy of PowerOps docs/examples/promote-dev-to-test.yml for the seed.
# Promotes the solution PowerOpsSeed from Dev to Test with a plan reviewed in the pull request.
# Read docs/examples/README.md before using it: it explains the setup and the risks.
#
# On a pull request, the plan job exports PowerOpsSeed as managed from Dev, plans the import into Test, comments the
# plan on the PR and keeps the exported zip and the plan file as an artifact. After the PR is merged, the find job
# looks that artifact up, and the apply job (in a GitHub environment with required reviewers) imports exactly those
# bytes into Test. Apply refuses if anything changed since the plan. Sign-in is GitHub OIDC; no credential is stored.
#
# Every URL, id and value is an environment secret (fake examples are in the README). The settings script
# below is the one in this folder; copy it into your repository and change the path if you move it.
name: Promote Dev to Test

on:
  pull_request:
    branches: [main]   # a PR merged into another branch must not promote
    types: [opened, synchronize, reopened, closed]

env:
  # The pac version this example was tested with; pin the version you test. Both jobs install it, so plan and apply run the same one.
  PAC_VERSION: 2.14.1

jobs:
  plan:
    # Not on close, and not for a fork (a fork PR gets no secrets).
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: test-plan
    permissions:
      contents: read
      id-token: write        # the OIDC sign-in
      pull-requests: write   # the plan comment
    concurrency:
      group: powerops-plan-${{ github.event.pull_request.number }}   # one plan comment per PR; a newer push cancels the older run
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Masking matches exact text only, so every form of both hosts is masked before any sign-in.
      - name: Mask the environment URLs' forms
        env:
          DEV_URL: ${{ secrets.DEV_URL }}
          TEST_URL: ${{ secrets.TEST_ENVIRONMENT_URL }}
        run: |
          for url in "$DEV_URL" "$TEST_URL"; do
            host="${url#*://}"; host="${host%%/*}"
            for v in "https://$host" "https://$host/" "$host" "${host,,}" "${host^^}" "${host%%.*}"; do echo "::add-mask::$v"; done
          done

      - name: Install pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version "$PAC_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # the app has no Azure subscription, only the environments

      - name: Sign in pac to Dev
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENVIRONMENT_URL: ${{ secrets.DEV_URL }}
        run: |
          # pac's sign-in output stays out of the public log unless debug logging is on.
          if ! pac auth create --githubFederated --tenant "$TENANT_ID" --applicationId "$CLIENT_ID" --environment "$ENVIRONMENT_URL" > "$RUNNER_TEMP/pac-auth.log" 2>&1; then
            echo "::error::pac auth create failed; its output is printed only with debug logging on"
            if [ "${RUNNER_DEBUG:-}" = 1 ]; then cat "$RUNNER_TEMP/pac-auth.log"; fi
            exit 1
          fi

      - name: Export PowerOpsSeed as managed from Dev
        env:
          ENVIRONMENT_URL: ${{ secrets.DEV_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          pac solution export --managed --name PowerOpsSeed --path "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip" --environment "$ENVIRONMENT_URL" --overwrite

      # The settings file sits beside the zip, named after it. It is built from one secret per value, never printed,
      # and left out of the artifact.
      - name: Build the Test settings file
        env:
          TEST_SEED_CONNECTION_ID: ${{ secrets.TEST_SEED_CONNECTION_ID }}
          TEST_SPARE_CONNECTION_ID: ${{ secrets.TEST_SPARE_CONNECTION_ID }}
          TEST_DEFAULT_STATUS: ${{ secrets.TEST_DEFAULT_STATUS }}
        run: bash .github/powerops/build-settings.sh "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.settings.json"

      # Pin this action to one commit SHA and use the same SHA in the plan and apply jobs: the plan file's `tool`
      # (the powerops version) must match, and two builds of one version cannot be told apart.
      - uses: Chrome71/PowerOps@a90c9a8e5d12eee17c20f34a32b31d1359742911 # main, M10 (PR 25)
        with:
          path: ${{ runner.temp }}/deploy   # the analysis gates the exact zip that will be imported
          upload-sarif: 'false'
          comment: 'true'
          deploy-folder: ${{ runner.temp }}/deploy
          target: ${{ secrets.TEST_ENVIRONMENT_URL }}

      # A private repository can drop this step and the decrypt step of the apply job (and the .enc in the upload path).
      # In a public repository anyone signed in to GitHub can download an artifact, and the zip is Dev's export.
      - name: Encrypt the zip
        env:
          POWEROPS_ZIP_KEY: ${{ secrets.POWEROPS_ZIP_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:POWEROPS_ZIP_KEY -in "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip" -out "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip.enc"

      # Only the zip (encrypted) and the plan file, never the settings file. Runs only when the plan step passed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerops-plan
          path: |
            ${{ runner.temp }}/deploy/PowerOpsSeed_managed.zip.enc
            ${{ runner.temp }}/deploy/powerops-plan.json
          overwrite: true      # a re-run replaces the artifact
          retention-days: 30   # at least as long as an approval may wait

  find:
    # Only a merged PR from this repository.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifact-id: ${{ steps.find.outputs.artifact-id }}
    steps:
      - name: Find the reviewed plan
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The newest unexpired plan artifact made by a run of the PR's head commit in this repository.
          artifact="$(gh api "repos/$REPO/actions/artifacts?name=powerops-plan&per_page=100" | jq -c --arg sha "$HEAD_SHA" --argjson repo_id "$REPO_ID" '
            [.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha and .workflow_run.head_repository_id == $repo_id)]
            | sort_by(.created_at) | last // empty')"
          if [ -z "$artifact" ]; then
            echo "::error::No plan artifact for the PR's last commit. Re-run the PR's last plan run, then re-run this run."
            exit 1
          fi
          id="$(jq -r '.id' <<< "$artifact")"
          run_id="$(jq -r '.workflow_run.id' <<< "$artifact")"
          gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/plan.zip"
          hash="$(unzip -p "$RUNNER_TEMP/plan.zip" powerops-plan.json | jq -r '.hash')"
          # The approver compares these with the plan comment on the PR before approving.
          {
            echo "## Plan to apply"
            echo
            echo "- Plan run: $run_id"
            echo "- Artifact: $id"
            echo "- Plan hash: $hash"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"

  apply:
    needs: find
    runs-on: ubuntu-latest
    environment: test   # required reviewers: the job waits here for an approval
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write   # the OIDC sign-in
      actions: read     # the artifact download
    concurrency:
      group: powerops-apply-${{ github.repository }}   # one apply at a time for the whole repository
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Mask the environment URLs' forms
        env:
          DEV_URL: ${{ secrets.DEV_URL }}
          TEST_URL: ${{ secrets.TEST_ENVIRONMENT_URL }}
        run: |
          for url in "$DEV_URL" "$TEST_URL"; do
            host="${url#*://}"; host="${host%%/*}"
            for v in "https://$host" "https://$host/" "$host" "${host,,}" "${host^^}" "${host%%.*}"; do echo "::add-mask::$v"; done
          done

      - name: Install pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version "$PAC_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download the reviewed plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.find.outputs.artifact-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/plan.zip"
          unzip -q "$RUNNER_TEMP/plan.zip" -d "$RUNNER_TEMP/deploy"

      - name: Decrypt the zip
        env:
          POWEROPS_ZIP_KEY: ${{ secrets.POWEROPS_ZIP_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:POWEROPS_ZIP_KEY -in "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip.enc" -out "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip"
          rm "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.zip.enc"

      # The same script and, in the test environment, the same values as in the plan job: equal bytes, so the hash holds.
      - name: Build the Test settings file
        env:
          TEST_SEED_CONNECTION_ID: ${{ secrets.TEST_SEED_CONNECTION_ID }}
          TEST_SPARE_CONNECTION_ID: ${{ secrets.TEST_SPARE_CONNECTION_ID }}
          TEST_DEFAULT_STATUS: ${{ secrets.TEST_DEFAULT_STATUS }}
        run: bash .github/powerops/build-settings.sh "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.settings.json"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign in pac to Test
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENVIRONMENT_URL: ${{ secrets.TEST_ENVIRONMENT_URL }}
        run: |
          if ! pac auth create --githubFederated --tenant "$TENANT_ID" --applicationId "$CLIENT_ID" --environment "$ENVIRONMENT_URL" > "$RUNNER_TEMP/pac-auth.log" 2>&1; then
            echo "::error::pac auth create failed; its output is printed only with debug logging on"
            if [ "${RUNNER_DEBUG:-}" = 1 ]; then cat "$RUNNER_TEMP/pac-auth.log"; fi
            exit 1
          fi

      # The same commit SHA as in the plan job.
      - uses: Chrome71/PowerOps@a90c9a8e5d12eee17c20f34a32b31d1359742911 # main, M10 (PR 25)
        with:
          path: ${{ runner.temp }}/deploy
          upload-sarif: 'false'
          fail-on: none   # the PR's plan job gated these exact bytes; the hash check proves they are the same
          plan-file: ${{ runner.temp }}/deploy/powerops-plan.json
          apply: 'true'
          target: ${{ secrets.TEST_ENVIRONMENT_URL }}
