name: PowerOps deploy plan
on: pull_request

permissions:
  contents: read
  pull-requests: write   # the comment
  id-token: write        # the OIDC sign-in

concurrency:
  group: powerops-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: test-plan
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The deploy folder holds the zip and, beside it, its settings file built from one secret per value.
      - name: Build the deploy folder
        if: env.SAME_REPO == 'true'
        env:
          SEED_CONNECTION_ID: ${{ secrets.TEST_SEED_CONNECTION_ID }}
          SPARE_CONNECTION_ID: ${{ secrets.TEST_SPARE_CONNECTION_ID }}
          DEFAULT_STATUS: ${{ secrets.TEST_DEFAULT_STATUS }}
        run: |
          mkdir "$RUNNER_TEMP/deploy"
          cp exports/*.zip "$RUNNER_TEMP/deploy/"
          jq -n --arg seed "$SEED_CONNECTION_ID" --arg spare "$SPARE_CONNECTION_ID" --arg status "$DEFAULT_STATUS" '{
            EnvironmentVariables: [{SchemaName: "pops_DefaultStatus", Value: $status}],
            ConnectionReferences: [
              {LogicalName: "pops_SeedDataverse", ConnectionId: $seed, ConnectorId: "/providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps"},
              {LogicalName: "pops_SpareDataverse", ConnectionId: $spare, ConnectorId: "/providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps"}
            ]
          }' > "$RUNNER_TEMP/deploy/PowerOpsSeed_managed.settings.json"

      - name: Install pac
        if: env.SAME_REPO == 'true'
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.SAME_REPO == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign in pac
        if: env.SAME_REPO == 'true'
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENVIRONMENT_URL: ${{ secrets.TEST_ENVIRONMENT_URL }}
        run: pac auth create --githubFederated --tenant "$TENANT_ID" --applicationId "$CLIENT_ID" --environment "$ENVIRONMENT_URL"

      - uses: Chrome71/PowerOps@claude/m9-deploy-plan-c53533
        with:
          path: solutions/powerops-seed
          upload-sarif: 'false'
          comment: 'true'
          deploy-folder: ${{ runner.temp }}/deploy
          target: ${{ env.SAME_REPO == 'true' && secrets.TEST_ENVIRONMENT_URL || '' }}

      # The zip and the plan file only; never the settings file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.SAME_REPO == 'true'
        with:
          name: powerops-plan
          retention-days: 1
          path: |
            ${{ runner.temp }}/deploy/*.zip
            ${{ runner.temp }}/deploy/powerops-plan.json
